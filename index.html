<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kopitiam Rasa estimate</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Kopitiam Rasa</h1>
    <p>Calculate an estimate. This page does not place or save an order.</p>
    <form id="order-form" novalidate>
      <div class="fields">
        <div class="field">
          <label for="product">Product</label>
          <select id="product" name="product">
            <option value="">Choose a product</option>
            <option value="kopi">Kopi — RM12</option>
            <option value="teh">Teh — RM3</option>
            <option value="milo">Milo — $1000</option>
          </select>
        </div>
        <div class="field">
          <label for="quantity">Quantity</label>
          <input id="quantity" name="quantity" type="text" inputmode="decimal" aria-describedby="quantity-help" autocomplete="off">
          <p id="quantity-help">Enter a whole number from 1 to 9.</p>
        </div>
      </div>
      <div class="actions">
        <button type="submit">Calculate</button>
        <button id="reset-estimate" type="button">Reset</button>
      </div>
    </form>
    <p id="message" class="feedback" role="status">Choose a product and enter a quantity.</p>
    <h2>Last valid estimate</h2>
    <p id="summary" aria-live="polite">No estimate yet.</p>
    <p>Reloading clears this estimate.</p>
    <noscript>Enable JavaScript to calculate an estimate.</noscript>
  </main>
</body>
</html>
